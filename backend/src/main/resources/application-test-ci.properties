# Perfil dedicado a CI: evita dependencias externas (PostgreSQL / secretos locales)
# y permite levantar el ApplicationContext de forma determinista.

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Valores de seguridad para el perfil de CI (sin depender de variables APP_*).
app.jwt.secret=ci-jwt-secret-at-least-32-characters-long
app.jwt.issuer=cursosonline-backend-ci
app.jwt.access-token-expiration-minutes=15
app.jwt.refresh-token-expiration-days=30
app.jwt.clock-skew-seconds=60
app.cors.allowed-origins=http://localhost:5173

# Mantener ruta de uploads compatible con tests/arranque de contexto.
spring.servlet.multipart.location=../uploads
