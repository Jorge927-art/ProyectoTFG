# Configuración de producción
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# En producción no se recomienda modificar esquema automáticamente.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# La cookie de renovación solo debe viajar por HTTPS y no puede ser leída por JS.
app.auth.refresh-cookie-name=${APP_AUTH_REFRESH_COOKIE_NAME:__Host-cursosonline_refresh}
app.auth.refresh-cookie-secure=${APP_AUTH_REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie-same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Strict}

# En producción no se aceptan orígenes implícitos ni comodines con credentials.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
